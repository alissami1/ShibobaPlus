name: Build ShibobaPlus

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid make
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/sdks"
          cp -R "$HOME"/sdks/*.sdk "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ShibobaPlus
          path: |
            .theos/obj/ShibobaPlus.dylib
            .theos/obj/arm64/ShibobaPlus.dylib
            packages/*.deb
          if-no-files-found: warn
