name: Build ShibobaPlus
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package
      - name: Collect
        run: |
          mkdir out
          find .theos -name 'ShibobaPlus.dylib' -print -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ShibobaPlus
          path: out/ShibobaPlus.dylib
